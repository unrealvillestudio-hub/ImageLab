# CI — corre los tests del repo en cada PR y en cada push a main.
#
# Por qué existe (2026-10-21): la barrera de voseo (`tests/sin_voseo_test.mjs`) y el resto de los
# tests sólo vigilaban si alguien corría `npm test` a mano. Sam pidió CI en los repos que no lo
# tenían, para que una regresión se vea en el PR y no después de mergear.
# Mismo patrón que `CopyLab/.github/workflows/ci.yml`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: .
      - run: npm test
        working-directory: .

  # 2026-11-19 — la función Python de la medida determinista (api/measure.py). Instala con el MISMO pyproject.toml que usa
  # Vercel (uv, sin OpenCV/matplotlib/sounddevice) y comprueba que cabe: si una versión nueva de MediaPipe arrastrara algo
  # pesado, el PR lo ve aquí y no en el despliegue.
  measure-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync
      - run: uv run python tests/medida_test.py
      - name: tamaño de las dependencias (límite de Vercel para Python, 500 MB)
        run: |
          size=$(du -sm .venv/lib/python3*/site-packages | cut -f1)
          echo "site-packages: ${size} MB"
          test "$size" -lt 400
      - name: MediaPipe importa con los módulos vacíos
        run: uv run python -c "import importlib.util as u; s=u.spec_from_file_location('m','api/measure.py'); m=u.module_from_spec(s); s.loader.exec_module(m); import mediapipe.tasks.python.vision as v; print('ok', m.MEASURE_VERSION)"
